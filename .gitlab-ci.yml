stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: $CI_REGISTRY_IMAGE/ai-call-center
  IMAGE_TAG: $CI_COMMIT_SHA

# Build Docker Image
build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  tags:
    - docker
  before_script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
  script:
    # Build the React application image with both tags in one command
    - docker build -f Dockerfile -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .

    # Push to GitLab Container Registry
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  after_script:
    # Clean up local images to save space
    - docker rmi $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Deploy to production
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # Write SSH key with proper formatting
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    # Debug: Check key format
    - head -1 ~/.ssh/deploy_key
    - tail -1 ~/.ssh/deploy_key
    # Try to add the key
    - ssh-add ~/.ssh/deploy_key
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - echo "Deploying to production server..."
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd /opt/ai-call-center &&
        sudo docker image pull registry.gitlab.com/zafarlabs/fe-ai-powered-call-center-demo/ai-call-center:latest &&
        sudo docker service update --force ai_call_center_fe &&
        echo 'Frontend service updated successfully'"
  environment:
    name: production
    url: https://demo-ai-powered-call-center.zafarlabs.com/dashboard
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  needs: ["build"]

